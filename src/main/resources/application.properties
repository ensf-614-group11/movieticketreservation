# Spring configuration
spring.application.name=movieticketreservation
server.port=8080

# MySQL Database Configuration (update the values to your MySQL instance)
spring.datasource.url=jdbc:mysql://localhost:3306/yourdb?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootpassword

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update   # Can be 'none' or 'validate' for production to prevent schema changes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Allow H2 Console (Can be disabled in production)
# spring.h2.console.enabled=true

# Logging Levels
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=DEBUG
logging.level.com.acmeplex.movieticketreservation=INFO

# Log output to a file
logging.file.name=logs/app.log
logging.file.max-size=15MB
logging.file.total-size-cap=20MB
logging.file.max-history=30

# Optional logging format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Spring Security default acmePlexUser credentials (this is just for development, can be removed in production)
# Remove or comment this for production if you're using DB-based authentication
spring.security.acmePlexUser.name=admin
spring.security.acmePlexUser.password=1111

# Profile setting (dev or prod environment)
spring.profiles.active=dev
