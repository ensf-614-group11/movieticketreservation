#spring.jpa.show-sql=true
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.datasource.initialize=true

# Logging Levels
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=DEBUG
logging.level.com.acmeplex.movieticketreservation=INFO

# Log output to a file
logging.file.name=logs/app.log
logging.file.max-size=15MB
logging.file.total-size-cap=20MB
logging.file.max-history=30

# Optional logging format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Spring Security default acmePlexUser credentials (this is just for development, can be removed in production)
# Remove or comment this for production if you're using DB-based authentication
spring.security.acmePlexUser.name=admin
spring.security.acmePlexUser.password=1111

# Profile setting (dev or prod environment)
spring.profiles.active=dev
